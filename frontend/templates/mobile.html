<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#101114"><title>Mirror Remote</title><link rel="stylesheet" href="{{ url_for('static',filename='styles.css') }}"></head>
<body class="mobile" data-token="{{ token }}"><main class="phone"><header><div class="brand"><b>M</b><span>Mirror</span></div><div class="phone-online"><i></i>Connected</div></header><section class="intro"><em>YOUR REMOTE WARDROBE</em><h1>What do you want to try?</h1><p>Changes appear instantly on both screens.</p></section>
<section class="phone-preview"><img src="/video-feed" alt="Live fitted garment preview"><div><i></i><span>Live body-mapped preview</span></div></section>
<section class="phone-grid">{% for garment in garments %}<button class="phone-garment" data-garment="{{ garment.id }}"><span><img src="{{ garment.thumbnail }}" alt=""></span><strong>{{ garment.name }}</strong><small>Upper body</small><b>✓</b></button>{% endfor %}</section>
<details class="feature-panel" open><summary><span><strong>Fit & preview controls</strong><small>Adjust mapping and viewing direction</small></span><b>⌄</b></summary><div class="feature-content">
<label class="select-control"><span><strong>Body view</strong><small>Turn around when using Back</small></span><select id="phoneView"><option value="auto">Auto tracking</option><option value="front">Front</option><option value="back">Back</option></select></label>
<label class="select-control"><span><strong>Garment fit</strong><small>Changes waist and overall size</small></span><select id="phoneFit"><option value="fitted">Fitted</option><option value="regular" selected>Regular</option><option value="relaxed">Relaxed</option></select></label>
<label class="toggle-control"><span><strong>Show body skeleton</strong><small>Helpful while positioning yourself</small></span><input id="phoneSkeleton" type="checkbox" checked><i></i></label></div></details>
<section class="controls"><button id="phoneClear">Remove current garment</button></section></main><div id="phoneToast" class="phone-toast" role="status"></div><script src="{{ url_for('static',filename='mobile.js') }}" defer></script></body></html>
